[build-system]
requires = [
    "setuptools>=68"
]
build-backend = "setuptools.build_meta"

[project]
name = "cputorch"
version = "0.5.7"
description = "A lightweight tensor and neural network framework with CPU and Vulkan backends"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Frandika Imam Arifin"}
]
keywords = [
    "machine-learning",
    "deep-learning",
    "tensor",
    "neural-network",
    "cpu",
    "vulkan",
    "ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics"
]

[project.urls]
Homepage = "https://github.com/Mangono1/minitorch"
Repository = "https://github.com/Mangono1/minitorch"
Issues = "https://github.com/Mangono1/minitorch/issues"
