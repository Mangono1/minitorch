name: CPUTorch - Build Wheels

on:
  push:
    branches:
      - main
      - feature/native-embedding

  workflow_dispatch:

jobs:

  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - os: ubuntu-latest
            name: linux-x86_64

          - os: windows-latest
            name: windows-x86_64

          - os: macos-15
            name: macos-arm64

          - os: macos-15-intel
            name: macos-x86_64

    runs-on: ${{ matrix.os }}

    env:
      CIBW_BUILD: cp313-*

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel

      - name: Build wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Verify wheel
        shell: bash
        run: |
          echo "=============================================="
          echo "CPUTorch ${{ matrix.name }}"
          echo "=============================================="
          ls -lah wheelhouse/

          COUNT=$(find wheelhouse -maxdepth 1 -name "*.whl" | wc -l)

          echo "Wheel count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Tidak ada wheel yang berhasil dibuat."
            exit 1
          fi

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cputorch-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  collect:
    name: Collect All Wheels

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-wheels
          pattern: cputorch-*
          merge-multiple: true

      - name: Show final wheels
        shell: bash
        run: |
          echo "=============================================="
          echo "CPUTorch - ALL WHEELS"
          echo "=============================================="

          find all-wheels -type f -name "*.whl" -print

          COUNT=$(find all-wheels -type f -name "*.whl" | wc -l)

          echo ""
          echo "TOTAL WHEELS: $COUNT"

          if [ "$COUNT" -lt 4 ]; then
            echo "ERROR: Kurang dari 4 wheel."
            exit 1
          fi

          echo ""
          echo "BUILD 4 PLATFORM BERHASIL."

      - name: Upload combined wheels
        uses: actions/upload-artifact@v4
        with:
          name: cputorch-all-wheels
          path: all-wheels/*.whl
          if-no-files-found: error
