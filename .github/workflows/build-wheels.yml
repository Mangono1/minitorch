name: Build and Publish CPUTorch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - os: ubuntu-latest
            name: linux-x86_64

          - os: windows-latest
            name: windows-x86_64

          - os: macos-15
            name: macos-arm64

          - os: macos-15-intel
            name: macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel

      - name: Build wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Show wheel
        shell: bash
        run: |
          echo "========================================"
          echo "CPUTorch - ${{ matrix.name }}"
          echo "========================================"
          ls -lah wheelhouse/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: cputorch-${{ matrix.name }}
          path: wheelhouse/*.whl


  publish:
    name: Publish CPUTorch to PyPI

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/cputorch/

    steps:

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cputorch-*
          merge-multiple: true

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist --outdir dist

      - name: Show distributions
        run: |
          echo "========================================"
          echo "CPUTorch distributions"
          echo "========================================"
          ls -lah dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
